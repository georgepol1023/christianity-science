<!doctype html>
<!-- The podcast cover (pictures/podcast-cover.jpg, 3000×3000). Drawn at 1000×1000 and saved at 3× by
     tools/podcast_cover.js. Same colours, orbit lines and cross as the home page. -->
<html lang="el">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  .cover { position: relative; width: 1000px; height: 1000px; overflow: hidden; color: #EEF0FA;
    background: radial-gradient(110% 95% at 78% 8%, #34489A 0%, #1C2B6E 46%, #0F1742 100%);
    font-family: Literata, Georgia, serif; }
  .sky { position: absolute; inset: 0; }
  .mark { position: absolute; left: 50%; top: 158px; width: 300px; height: 300px; transform: translateX(-50%); }
  .title { position: absolute; left: 0; right: 0; top: 520px; text-align: center; font-weight: 600; font-size: 104px;
    line-height: 1.08; letter-spacing: -.5px; }
  .amp { color: #C8A54A; font-style: italic; font-weight: 500; display: block; font-size: 84px; line-height: 1; margin: 6px 0 4px; }
  .sub { position: absolute; left: 0; right: 0; bottom: 64px; text-align: center; font: 500 30px/1.3 Commissioner, sans-serif;
    letter-spacing: 5px; text-transform: uppercase; color: #C9CEE8; }
  .rule { position: absolute; left: 50%; bottom: 122px; width: 120px; height: 3px; margin-left: -60px; background: #C8A54A; border-radius: 2px; }
</style>
</head>
<body>
<div class="cover" id="cover">
  <svg class="sky" viewBox="0 0 1000 1000" aria-hidden="true">
    <g fill="none" stroke="#EEF0FA">
      <circle cx="820" cy="110" r="430" stroke-width="1.6" opacity=".13"/>
      <circle cx="820" cy="110" r="300" stroke-width="1.6" opacity=".10"/>
      <ellipse cx="820" cy="110" rx="620" ry="200" stroke-width="1.6" opacity=".12" transform="rotate(-18 820 110)"/>
    </g>
    <g fill="#EEF0FA" id="stars"></g>
  </svg>
  <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
    <circle cx="20" cy="20" r="17" fill="none" stroke="#EEF0FA" stroke-width="1" opacity=".6"/>
    <ellipse cx="20" cy="20" rx="17" ry="6.5" fill="none" stroke="#EEF0FA" stroke-width=".8" opacity=".4" transform="rotate(-28 20 20)"/>
    <path d="M20 8v24M13 16h14" stroke="#C8A54A" stroke-width="2.4" stroke-linecap="round"/>
  </svg>
  <div class="title">Χριστιανισμός<span class="amp">&amp;</span>Επιστήμη</div>
  <div class="rule"></div>
  <div class="sub">Ραδιοφωνική εκπομπή</div>
</div>
<script>
  // the same scattered stars every time
  var g = document.getElementById("stars"), seed = 7, rnd = function () { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  for (var i = 0; i < 70; i++) {
    var x = rnd() * 1000, y = rnd() * 1000;
    if (y > 470 && y < 900 && x > 60 && x < 940) continue;          // keep the title clear
    var c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c.setAttribute("cx", x.toFixed(1)); c.setAttribute("cy", y.toFixed(1));
    c.setAttribute("r", (0.8 + rnd() * 1.8).toFixed(2)); c.setAttribute("opacity", (0.25 + rnd() * 0.55).toFixed(2));
    g.appendChild(c);
  }
</script>
</body>
</html>
